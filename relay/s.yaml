# Serverless Devs(s 3.x) 开工单：把 chatgpt.com 透明中继送进阿里云函数计算 3.0 Web 函数，不是送外卖。
#
#   export RELAY_KEY="$(openssl rand -hex 32)"   # 客户端请求头 X-Relay-Key 要用同一把钥匙，长得像不算
#   s deploy -y
#
# 部署输出的 HTTP 触发器地址就是新门脸：客户端把 https://chatgpt.com 换成它，别敲旧门。
# 包工头的细账在同目录 README.md，别靠掐指一算部署。
edition: 3.0.0
name: chatgpt-relay
access: default

vars:
  # 函数地域就是回源出口的落脚处，不是家乡籍贯；OpenAI 不向中国内地、香港等地区提供服务，须选它支持
  # 的国家/地区，例如 ap-southeast-1(新加坡)、ap-northeast-1(东京)、us-west-1(硅谷)，别拿地图当通行证。
  region: us-west-1

resources:
  relay:
    component: fc3
    props:
      region: ${vars.region}
      functionName: chatgpt_relay
      description: chatgpt.com transparent relay (SSE streaming)
      # custom.debian10 自带 Node.js 20(/var/fc/lang/nodejs20) 这口锅；中继零依赖，不用再叠层蒸笼。
      runtime: custom.debian10
      code: ./                      # .fcignore 把测试/文档/本文件留在后台，代码包只让 index.js 登台
      customRuntimeConfig:
        command:
          - /var/fc/lang/nodejs20/bin/node
        args:
          - index.js
        port: 9000                  # 与 index.js 的 FC_SERVER_PORT 默认值对门牌，别隔墙喊话
      cpu: 0.5
      memorySize: 512
      diskSize: 512
      # 中继主要等 I/O，一个实例可接多条流；不必每来一位客人就另起炉灶冷启动。
      instanceConcurrency: 100
      # 单次调用上限管一条 SSE 能坐多久(平台上限 86400)；默认仅 3 秒，不设就菜没上齐先撤桌。
      timeout: 3600
      internetAccess: true
      environmentVariables:
        RELAY_KEY: ${env('RELAY_KEY')}
        # transparent 让售票窗口彻底下班：关闭 X-Relay-Mint 打票，所有请求只做透明中继。
        # 不设置就按老规矩(mint)：普通请求走透明中继，亮出 X-Relay-Mint 才去售票窗口。
        RELAY_MODE: ${env('RELAY_MODE')}
        # 当前回到老班底：不设住宅代理，直接用 FC 部署地域 us-west-1 阿里云出口，
        # 不开旧称“满血门”的状态验证(MINT_VERIFY_STATE)、不轮换出口；这不是能力保证。要恢复这些开关，部署前
        # export MINT_UPSTREAM_PROXY=... 并把 MINT_VERIFY_STATE/MINT_ROTATE_SID 加回，别只喊开工不接水管。
        # 打票(X-Relay-Mint)的选配菜单如下，默认值请找 index.js / README.md 对账：
        # MINT_GATEWAY: unified-88          # 目标网关的门牌；any 就不查门牌
        # MINT_MODELS: gpt-6-sol,gpt-6-luna,gpt-6-astra  # 打票模型点名册，逗号负责分桌
        # MINT_TICKET_LEN: '780'            # 只量票长，不鉴定武功；0 不查
        # MINT_TICKET_TTL_S: '240'          # 票在柜里放多少秒；0 不寄存
        # MINT_MAX_ATTEMPTS: '24'           # 每模型最多跑多少圈，范围 1-128，别跑成永动机
      # logConfig: auto             # 要记请求流水账才打开（会创建 SLS project/logstore，不是免费凭空变账本）
      triggers:
        - triggerName: defaultTrigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            # 平台层不查身份，函数亲自守门(X-Relay-Key)；RELAY_KEY 未配置就全拒，不是大门常开。
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - HEAD
